name: Curefoods
description: 'Curefoods is a Bengaluru-based multi-brand cloud kitchen and quick-service
  restaurant company founded in 2020 that builds and operates iconic Indian food brands.
  As of March 2025 it runs roughly 502 outlets across India (about 281 cloud kitchens,
  99 kiosks, and 122 restaurants) under a house-of-brands model including Kitchens
  of EatFit, Sharief Bhai, Olio Pizza, Nomad Pizza, Arambam, CakeZone, Frozen Bottle,
  and Krispy Kreme. Backed by Accel, Chiratae Ventures, and Iron Pillar, the company
  crossed roughly Rs 746 crore in FY25 revenue and has received SEBI approval for an
  IPO. Curefoods is a consumer food operator with no public developer API or documentation
  surface; this profile was added to the API Evangelist network as a portfolio lead
  and carries only identity, domain-security, and public-property signals.'
